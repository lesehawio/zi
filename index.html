<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZI ✦ چرخه زیستن</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ZI — Pro Visual Layer
   ========================================================= */
:root{
    --bg:#f4f5f7;
    --bg-2:#ffffff;
    --surface:#ffffff;
    --surface-2:#fafbfc;
    --surface-3:#f0f2f5;
    --panel:rgba(0,0,0,.015);
    --panel-2:rgba(0,0,0,.03);
    --panel-3:rgba(0,0,0,.05);
    --line:rgba(15,20,25,.06);
    --line-2:rgba(15,20,25,.09);
    --line-3:rgba(15,20,25,.14);
    --ink:#0d1117;
    --ink-2:#2a3038;
    --ink-3:#57606a;
    --muted:#7d8590;
    --muted-2:#a0a8b1;
    --muted-3:#c8cdd4;
    --accent:#0d1117;
    --accent-ink:#ffffff;

    --gold:#b8945a;
    --gold-2:#d4b276;
    --gold-soft:rgba(184,148,90,.1);
    --gold-line:rgba(184,148,90,.28);

    --state-cont:#1a9f55;
    --state-cont-2:#22c55e;
    --state-cont-soft:rgba(26,159,85,.09);
    --state-cont-line:rgba(26,159,85,.24);

    --state-neut:#6b7280;
    --state-neut-soft:rgba(107,114,128,.08);
    --state-neut-line:rgba(107,114,128,.2);

    --state-disc:#dc2626;
    --state-disc-2:#ef4444;
    --state-disc-soft:rgba(220,38,38,.08);
    --state-disc-line:rgba(220,38,38,.24);

    --overlay:rgba(255,255,255,.6);
    --shadow-xs:0 1px 2px rgba(15,20,25,.04);
    --shadow-sm:0 2px 6px rgba(15,20,25,.06),0 1px 2px rgba(15,20,25,.04);
    --shadow:0 4px 14px rgba(15,20,25,.07),0 1px 3px rgba(15,20,25,.04);
    --shadow-md:0 10px 30px rgba(15,20,25,.09),0 2px 6px rgba(15,20,25,.05);
    --shadow-lg:0 20px 50px rgba(15,20,25,.12),0 6px 16px rgba(15,20,25,.06);
    --shadow-xl:0 30px 70px rgba(15,20,25,.16),0 10px 24px rgba(15,20,25,.08);
    --shadow-2:0 12px 40px rgba(0,0,0,.12);

    --radius-sm:10px;
    --radius:14px;
    --radius-lg:18px;
    --radius-xl:22px;
    --radius-2xl:28px;
}

html[data-theme="dark"]{
    --bg:#0a0c10;
    --bg-2:#0f1318;
    --surface:#12161c;
    --surface-2:#161b22;
    --surface-3:#1c2229;
    --panel:rgba(255,255,255,.015);
    --panel-2:rgba(255,255,255,.03);
    --panel-3:rgba(255,255,255,.05);
    --line:rgba(255,255,255,.055);
    --line-2:rgba(255,255,255,.09);
    --line-3:rgba(255,255,255,.15);
    --ink:#e6edf3;
    --ink-2:#b8c1cc;
    --ink-3:#8a94a1;
    --muted:#6b7280;
    --muted-2:#4b5360;
    --muted-3:#2d333c;
    --accent:#e6edf3;
    --accent-ink:#0a0c10;

    --gold:#d4b276;
    --gold-2:#e8ca8f;
    --gold-soft:rgba(212,178,118,.09);
    --gold-line:rgba(212,178,118,.26);

    --state-cont:#22c55e;
    --state-cont-2:#4ade80;
    --state-cont-soft:rgba(34,197,94,.1);
    --state-cont-line:rgba(34,197,94,.26);

    --state-neut:#9ca3af;
    --state-neut-soft:rgba(156,163,175,.08);
    --state-neut-line:rgba(156,163,175,.22);

    --state-disc:#ef4444;
    --state-disc-2:#f87171;
    --state-disc-soft:rgba(239,68,68,.1);
    --state-disc-line:rgba(239,68,68,.26);

    --overlay:rgba(0,0,0,.65);
    --shadow-xs:0 1px 2px rgba(0,0,0,.3);
    --shadow-sm:0 2px 6px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow:0 4px 14px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
    --shadow-lg:0 20px 50px rgba(0,0,0,.65),0 6px 16px rgba(0,0,0,.4);
    --shadow-xl:0 30px 70px rgba(0,0,0,.7),0 10px 24px rgba(0,0,0,.45);
    --shadow-2:0 12px 40px rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
    font-family:'Inter',Tahoma,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:0 16px 30px;transition:background .4s ease,color .4s ease;
    font-size:14px;line-height:1.5;
    background-image:
        radial-gradient(circle at 0% 0%,rgba(184,148,90,.04),transparent 45%),
        radial-gradient(circle at 100% 100%,rgba(26,159,85,.03),transparent 45%);
    background-attachment:fixed;
}
html[data-theme="dark"] body{
    background-image:
        radial-gradient(circle at 0% 0%,rgba(212,178,118,.05),transparent 45%),
        radial-gradient(circle at 100% 100%,rgba(34,197,94,.03),transparent 45%);
}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;outline:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--line-3);outline-offset:2px}

/* ===== LOGO BIG MOTION ===== */
.logo-big-wrap{
    width:100%;max-width:680px;display:flex;justify-content:center;
    align-items:center;padding:22px 0 34px;min-height:180px;
    position:relative;
}
.logo-big-wrap::before{
    content:"";position:absolute;width:220px;height:220px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(184,148,90,.1),transparent 65%);
    filter:blur(30px);
    animation:logoGlow 6s ease-in-out infinite;
}
html[data-theme="dark"] .logo-big-wrap::before{
    background:radial-gradient(circle,rgba(212,178,118,.14),transparent 65%);
}
@keyframes logoGlow{
    0%,100%{opacity:.6;transform:scale(1)}
    50%{opacity:1;transform:scale(1.1)}
}
.logo-motion{
    position:relative;width:110px;height:160px;flex-shrink:0;
    pointer-events:none;z-index:1;
    filter:drop-shadow(0 8px 24px rgba(15,20,25,.15));
}
html[data-theme="dark"] .logo-motion{
    filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));
}
.logo-motion svg{width:100%;height:100%;overflow:visible}
.logo-motion .piece{
    fill:var(--ink);transform-box:fill-box;transform-origin:center;
    animation-iteration-count:infinite;animation-duration:7s;
    animation-timing-function:cubic-bezier(.18,.89,.25,1);
}
.logo-motion .top-triangle{animation-name:messyTop}
.logo-motion .bottom-triangle{animation-name:messyBottom}
.logo-motion .top-bar{animation-name:messyTopBar}
.logo-motion .bottom-bar{animation-name:messyBottomBar}

@keyframes messyTop{
    0%{opacity:0;transform:translate(-55px,-60px) rotate(-65deg) scale(.35)}
    8%{opacity:1;transform:translate(-35px,-30px) rotate(-35deg) scale(.65)}
    17%{transform:translate(20px,-18px) rotate(42deg) scale(.82)}
    27%{transform:translate(-12px,14px) rotate(-22deg) scale(1.08)}
    36%{transform:translate(7px,-7px) rotate(13deg) scale(.96)}
    43%{transform:translate(-3px,3px) rotate(-5deg) scale(1.02)}
    48%{transform:translate(0,0) rotate(0) scale(1)}
    70%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
    82%{transform:translate(-5px,-4px) rotate(-7deg) scale(1.03)}
    100%{opacity:0;transform:translate(-55px,-60px) rotate(-65deg) scale(.35)}
}
@keyframes messyBottom{
    0%{opacity:0;transform:translate(65px,60px) rotate(70deg) scale(.3)}
    9%{opacity:1;transform:translate(40px,35px) rotate(38deg) scale(.55)}
    18%{transform:translate(-22px,20px) rotate(-48deg) scale(.8)}
    28%{transform:translate(15px,-12px) rotate(25deg) scale(1.1)}
    37%{transform:translate(-8px,8px) rotate(-12deg) scale(.94)}
    44%{transform:translate(4px,-3px) rotate(6deg) scale(1.03)}
    49%{transform:translate(0,0) rotate(0) scale(1)}
    70%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
    82%{transform:translate(5px,4px) rotate(7deg) scale(1.03)}
    100%{opacity:0;transform:translate(65px,60px) rotate(70deg) scale(.3)}
}
@keyframes messyTopBar{
    0%{opacity:0;transform:translate(55px,-35px) rotate(75deg) scale(.3)}
    13%{opacity:1;transform:translate(28px,-12px) rotate(35deg) scale(.65)}
    24%{transform:translate(-12px,9px) rotate(-25deg) scale(1.12)}
    34%{transform:translate(8px,-5px) rotate(16deg) scale(.92)}
    44%{transform:translate(-3px,2px) rotate(-5deg) scale(1.04)}
    50%{transform:translate(0,0) rotate(0) scale(1)}
    70%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
    100%{opacity:0;transform:translate(55px,-35px) rotate(75deg) scale(.3)}
}
@keyframes messyBottomBar{
    0%{opacity:0;transform:translate(70px,65px) rotate(-65deg) scale(.25)}
    11%{opacity:1;transform:translate(40px,35px) rotate(-35deg) scale(.55)}
    22%{transform:translate(-18px,-8px) rotate(30deg) scale(1.08)}
    32%{transform:translate(12px,10px) rotate(-17deg) scale(.92)}
    43%{transform:translate(-5px,-3px) rotate(8deg) scale(1.04)}
    51%{transform:translate(0,0) rotate(0) scale(1)}
    70%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
    100%{opacity:0;transform:translate(70px,65px) rotate(-65deg) scale(.25)}
}

/* ===== HEADER ===== */
.header{
    width:100%;max-width:680px;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;margin-bottom:22px;
    min-height:56px;
    border-bottom:1px solid var(--line);
    position:relative;
}
.header-left{display:flex;align-items:center;gap:12px}
.menu-btn,.theme-btn{
    background:var(--surface);
    border:1px solid var(--line-2);
    color:var(--ink-2);
    width:40px;height:40px;border-radius:12px;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--shadow-xs);
}
.menu-btn:hover,.theme-btn:hover{
    background:var(--surface-2);
    border-color:var(--line-3);
    color:var(--ink);
    box-shadow:var(--shadow-sm);
    transform:translateY(-1px);
}
.menu-btn:active,.theme-btn:active{transform:translateY(0)}
.theme-btn .icon-sun{display:none}
html[data-theme="dark"] .theme-btn .icon-sun{display:block}
html[data-theme="dark"] .theme-btn .icon-moon{display:none}

/* ===== COMMAND ===== */
.command-wrap{width:100%;max-width:680px;position:relative}
.command-box{
    background:var(--surface);
    border:1px solid var(--line-2);
    border-radius:var(--radius-lg);
    padding:8px 8px 8px 16px;
    display:flex;align-items:center;gap:10px;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--shadow-sm);
    position:relative;
    overflow:hidden;
}
.command-box::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:1px;
    background:linear-gradient(135deg,transparent,transparent);
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
}
.command-box:focus-within{
    border-color:var(--line-3);
    box-shadow:var(--shadow-md),0 0 0 4px var(--panel-2);
    transform:translateY(-1px);
}
.command-box:focus-within::before{
    opacity:1;
    background:linear-gradient(135deg,var(--gold-line),transparent 60%);
}
.command-box .prefix{
    color:var(--muted-2);font-size:14px;flex-shrink:0;
    transition:color .3s ease;
}
.command-box:focus-within .prefix{color:var(--gold)}
#command{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--ink);font-size:14px;padding:10px 0;
    min-height:40px;font-weight:400;
    letter-spacing:.1px;
}
#command::placeholder{color:var(--muted-2);font-weight:400}

.actions{display:flex;gap:6px;align-items:center}
.icon-btn{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;transition:all .25s cubic-bezier(.4,0,.2,1);
    flex-shrink:0;
    position:relative;
}
.icon-btn:hover{
    border-color:var(--line-3);
    color:var(--ink);
    background:var(--panel-3);
    transform:translateY(-1px);
    box-shadow:var(--shadow-xs);
}
.icon-btn:active{transform:translateY(0)}
.icon-btn.voice{color:var(--ink-3);border-color:var(--line-2)}
.icon-btn.voice:hover{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
.icon-btn.voice.listening{
    background:var(--state-disc);color:#fff;
    border-color:var(--state-disc);
    animation:pulseMic 1.2s ease-in-out infinite;
    box-shadow:0 0 0 6px var(--state-disc-soft);
}
@keyframes pulseMic{
    0%,100%{transform:scale(1);box-shadow:0 0 0 6px var(--state-disc-soft)}
    50%{transform:scale(1.06);box-shadow:0 0 0 10px rgba(220,38,38,.06)}
}
.icon-btn.filter-btn{
    width:auto;padding:0 12px;border-radius:20px;gap:5px;
    font-size:11px;font-weight:600;
}
.filter-badge{
    background:var(--accent);color:var(--accent-ink);
    font-size:8px;border-radius:50%;width:14px;height:14px;
    display:none;align-items:center;justify-content:center;
    font-weight:800;margin-right:2px;
}

.voice-live{
    margin-top:12px;
    background:var(--surface);
    border:1px solid var(--state-disc-line);
    border-radius:var(--radius);
    padding:12px 16px;
    display:none;align-items:center;gap:12px;
    font-size:12px;
    box-shadow:var(--shadow-sm);
    animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.voice-live.show{display:flex}
.voice-live .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--state-disc);
    animation:pulseMic 1s infinite;flex-shrink:0;
    box-shadow:0 0 0 3px var(--state-disc-soft);
}
.voice-live .vtext{
    flex:1;color:var(--ink-2);font-weight:500;
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.voice-live .vtext.empty{color:var(--muted-2);font-weight:400;font-style:italic}

.filter-dropdown{
    position:absolute;top:calc(100% + 8px);left:0;right:0;
    background:var(--surface);
    border:1px solid var(--line-2);
    border-radius:var(--radius-lg);
    padding:14px 16px;display:none;max-height:260px;overflow-y:auto;
    z-index:50;box-shadow:var(--shadow-lg);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    animation:dropdownIn .25s cubic-bezier(.4,0,.2,1);
}
@keyframes dropdownIn{
    from{opacity:0;transform:translateY(-6px) scale(.98)}
    to{opacity:1;transform:none}
}
.filter-dropdown.open{display:block}
.filter-grid{display:flex;flex-wrap:wrap;gap:6px}
.filter-chip{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;font-size:11.5px;
    color:var(--muted);transition:all .25s cubic-bezier(.4,0,.2,1);
    display:inline-flex;align-items:center;gap:6px;font-weight:500;
}
.filter-chip:hover{
    background:var(--surface-3);
    border-color:var(--line-3);
    color:var(--ink);
    transform:translateY(-1px);
    box-shadow:var(--shadow-xs);
}
.filter-chip.active{
    background:var(--accent);border-color:var(--accent);
    color:var(--accent-ink);font-weight:700;
    box-shadow:var(--shadow-sm);
}
.filter-chip .count{font-size:9.5px;opacity:.7;font-weight:600}
.filter-chip .dotc{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.filter-chip[data-f="continuous"] .dotc{background:var(--state-cont);box-shadow:0 0 6px var(--state-cont-line)}
.filter-chip[data-f="neutral"] .dotc{background:var(--state-neut)}
.filter-chip[data-f="disconnected"] .dotc{background:var(--state-disc);box-shadow:0 0 6px var(--state-disc-line)}
.filter-chip[data-f="archive"] .dotc{background:var(--gold)}

/* ===== RESULTS ===== */
.results{width:100%;max-width:680px;margin-top:16px;display:none}
.results.visible{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.results .count{
    font-size:11.5px;color:var(--muted-2);
    padding:0 6px 12px;display:block;font-weight:500;
    letter-spacing:.3px;
}
.cards{display:flex;flex-direction:column;gap:12px}

/* ===== CARD ===== */
.card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 20px 18px 22px;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-sm);
}
.card::before{
    content:"";
    position:absolute;
    top:0;bottom:0;right:0;
    width:3px;
    background:var(--state-neut);
    transition:background .3s ease;
}
.card.continuous::before{background:var(--state-cont)}
.card.neutral::before{background:var(--state-neut)}
.card.disconnected::before{background:var(--state-disc)}
.card.archived::before{background:var(--gold)}

.card::after{
    content:"";
    position:absolute;
    top:0;right:0;left:0;bottom:0;
    background:radial-gradient(circle at 100% 0%,var(--state-neut-soft),transparent 50%);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
}
.card.continuous::after{background:radial-gradient(circle at 100% 0%,var(--state-cont-soft),transparent 50%)}
.card.disconnected::after{background:radial-gradient(circle at 100% 0%,var(--state-disc-soft),transparent 50%)}
.card.archived::after{background:radial-gradient(circle at 100% 0%,var(--gold-soft),transparent 50%)}
.card:hover::after{opacity:1}

.card:hover{
    border-color:var(--line-2);
    box-shadow:var(--shadow-md);
    transform:translateY(-2px);
}
.card.archived{
    background:
        repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(0,0,0,.012) 12px,rgba(0,0,0,.012) 24px),
        var(--surface);
    opacity:.82;
}
html[data-theme="dark"] .card.archived{
    background:
        repeating-linear-gradient(135deg,transparent,transparent 12px,rgba(255,255,255,.012) 12px,rgba(255,255,255,.012) 24px),
        var(--surface);
}

.card > *{position:relative;z-index:1}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-name{
    font-size:16px;font-weight:800;line-height:1.4;
    color:var(--ink);letter-spacing:-.3px;
}
.card-code{
    margin-top:4px;
    direction:ltr;text-align:right;
    color:var(--muted-2);font-size:10px;
    letter-spacing:.8px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-weight:500;
}
.card-type{
    font-size:10px;padding:5px 11px;border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--muted);font-weight:600;
    flex-shrink:0;white-space:nowrap;
    letter-spacing:.2px;
}

.card-meta{
    display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
    margin-top:14px;padding:12px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.card-meta .m-item{display:flex;flex-direction:column;gap:4px;text-align:center}
.card-meta .m-lbl{
    font-size:9.5px;color:var(--muted-2);
    font-weight:600;letter-spacing:.5px;text-transform:uppercase;
}
.card-meta .m-val{
    font-size:12.5px;color:var(--ink-2);
    font-weight:700;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.card-status{
    display:flex;align-items:center;gap:10px;
    margin-top:14px;padding:11px 14px;
    border-radius:12px;font-size:12px;font-weight:700;
    border:1px solid var(--line);
    background:var(--surface-2);
    transition:all .3s ease;
}
.card-status.continuous{
    color:var(--state-cont);
    background:var(--state-cont-soft);
    border-color:var(--state-cont-line);
}
.card-status.neutral{
    color:var(--state-neut);
    background:var(--state-neut-soft);
    border-color:var(--state-neut-line);
}
.card-status.disconnected{
    color:var(--state-disc);
    background:var(--state-disc-soft);
    border-color:var(--state-disc-line);
}
.card-status.archived{
    color:var(--gold);
    background:var(--gold-soft);
    border-color:var(--gold-line);
}
.card-status .dot{
    width:9px;height:9px;border-radius:50%;
    background:currentColor;
    box-shadow:0 0 0 4px currentColor;
    opacity:.9;
    animation:breathe 2.6s ease-in-out infinite;
    flex-shrink:0;
}
@keyframes breathe{
    0%,100%{transform:scale(1);opacity:.9}
    50%{transform:scale(.82);opacity:.6}
}
.card-status i{font-size:12px;opacity:.85}
.card-status .hint{
    margin-right:auto;font-size:10.5px;
    color:var(--muted);font-weight:500;
    padding:3px 9px;border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--line);
}

.cycle{
    height:5px;border-radius:99px;
    background:var(--panel-2);
    margin-top:14px;overflow:hidden;
    position:relative;
}
.cycle-fill{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--state-neut),var(--state-neut));
    transition:width .5s cubic-bezier(.4,0,.2,1);
    position:relative;
}
.cycle-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
    animation:shimmer 2s infinite;
}
@keyframes shimmer{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(100%)}
}
.card.continuous .cycle-fill{background:linear-gradient(90deg,var(--state-cont),var(--state-cont-2))}
.card.disconnected .cycle-fill{background:linear-gradient(90deg,var(--state-disc),var(--state-disc-2))}
.card.archived .cycle-fill{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.cycle-label{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--muted-2);
    margin-top:6px;font-weight:500;
    letter-spacing:.2px;
}

.ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.op{
    display:inline-flex;align-items:center;gap:6px;
    font-size:10.5px;padding:5px 11px;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--muted-2);font-weight:500;
    transition:all .25s ease;
}
.op.on{
    background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);font-weight:700;
    box-shadow:var(--shadow-xs);
}
.op.na{opacity:.32;text-decoration:line-through}
.op i{font-size:9px}

.quick{
    display:flex;gap:6px;margin-top:14px;
    padding-top:14px;border-top:1px solid var(--line);
}
.quick button{
    flex:1;border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:11px;padding:9px 6px;
    font-size:10.5px;color:var(--muted);
    font-weight:700;transition:all .25s cubic-bezier(.4,0,.2,1);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;justify-content:center;gap:5px;
}
.quick button:hover{
    border-color:var(--line-3);color:var(--ink);
    background:var(--surface-3);transform:translateY(-1px);
    box-shadow:var(--shadow-xs);
}
.quick button:active{transform:translateY(0)}
.quick button.cont{color:var(--state-cont);border-color:var(--state-cont-line)}
.quick button.cont:hover{background:var(--state-cont-soft);color:var(--state-cont)}
.quick button.disc{color:var(--state-disc);border-color:var(--state-disc-line)}
.quick button.disc:hover{background:var(--state-disc-soft);color:var(--state-disc)}
.quick button.gold{color:var(--gold);border-color:var(--gold-line)}
.quick button.gold:hover{background:var(--gold-soft);color:var(--gold)}

.card-time{
    margin-top:12px;font-size:9.5px;
    color:var(--muted-3);
    text-align:left;direction:ltr;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-weight:500;letter-spacing:.3px;
}

.empty{
    text-align:center;padding:70px 20px;
    background:var(--surface);
    border:1px dashed var(--line-2);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-xs);
}
.empty i{
    font-size:32px;color:var(--muted-2);
    display:block;margin-bottom:14px;
    opacity:.6;
}
.empty .title{
    font-size:14px;font-weight:700;
    color:var(--ink-3);letter-spacing:-.2px;
}
.empty .desc{
    font-size:12px;color:var(--muted-2);
    margin-top:6px;font-weight:400;
}

.back-wrap{width:100%;max-width:680px;display:none;margin-top:14px}
.back-wrap.visible{display:flex;animation:fadeIn .3s ease}
.back-btn{
    background:var(--surface);
    border:1px solid var(--line-2);
    color:var(--muted);
    padding:7px 16px;border-radius:999px;font-size:11.5px;
    display:inline-flex;align-items:center;gap:7px;
    transition:all .25s cubic-bezier(.4,0,.2,1);font-weight:500;
    box-shadow:var(--shadow-xs);
}
.back-btn:hover{
    border-color:var(--line-3);color:var(--ink);
    background:var(--surface-2);transform:translateY(-1px);
    box-shadow:var(--shadow-sm);
}

.info{
    margin-top:20px;font-size:10.5px;
    color:var(--muted-3);
    text-align:center;font-weight:500;
    letter-spacing:.5px;
}

/* ===== SIDEBAR ===== */
.sidebar{
    position:fixed;top:0;right:-100%;
    width:300px;max-width:86vw;height:100%;
    background:var(--surface);
    border-left:1px solid var(--line-2);
    z-index:1000;padding:22px;
    transition:right .4s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    box-shadow:var(--shadow-xl);
}
.sidebar.open{right:0}
.sidebar-overlay{
    position:fixed;inset:0;background:var(--overlay);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:999;display:none;
}
.sidebar-overlay.active{display:block;animation:fadeIn .3s ease}

.side-header{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;border-bottom:1px solid var(--line);
    margin-bottom:20px;
}
.side-header .brand{
    display:flex;align-items:center;gap:11px;
    font-size:19px;font-weight:900;
    color:var(--ink);letter-spacing:-.7px;
}
.side-header .brand svg{
    width:24px;height:34px;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));
}
.sidebar-close{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--muted-2);
    width:34px;height:34px;border-radius:10px;
    font-size:14px;cursor:pointer;
    transition:all .25s ease;
    display:flex;align-items:center;justify-content:center;
}
.sidebar-close:hover{
    color:var(--ink);background:var(--surface-3);
    border-color:var(--line-3);
}

.side-stats{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:10px;margin-bottom:22px;
}
.side-stat{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px 12px;
    text-align:center;
    transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative;overflow:hidden;
    box-shadow:var(--shadow-xs);
}
.side-stat::before{
    content:"";position:absolute;
    top:0;left:0;right:0;height:2px;
    background:var(--muted-2);
    transition:opacity .3s ease;
}
.side-stat.cont::before{background:var(--state-cont)}
.side-stat.neut::before{background:var(--state-neut)}
.side-stat.disc::before{background:var(--state-disc)}
.side-stat.arch::before{background:var(--gold)}
.side-stat:hover{
    border-color:var(--line-2);
    background:var(--surface-3);
    transform:translateY(-2px);
    box-shadow:var(--shadow-sm);
}
.side-stat .v{
    font-size:22px;font-weight:900;
    color:var(--ink);font-variant-numeric:tabular-nums;
    letter-spacing:-.8px;line-height:1;
}
.side-stat .l{
    font-size:10px;color:var(--muted-2);
    margin-top:5px;font-weight:600;
    letter-spacing:.3px;
}
.side-stat.cont .v{color:var(--state-cont)}
.side-stat.neut .v{color:var(--state-neut)}
.side-stat.disc .v{color:var(--state-disc)}
.side-stat.arch .v{color:var(--gold)}

.side-label{
    font-size:9.5px;color:var(--muted-2);
    font-weight:800;letter-spacing:1.2px;
    text-transform:uppercase;
    padding:0 6px 10px;
    margin-top:6px;
}
.sidebar-nav{display:flex;flex-direction:column;gap:4px}
.sidebar-nav .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;border-radius:11px;
    color:var(--ink-3);
    transition:all .25s cubic-bezier(.4,0,.2,1);
    border:1px solid transparent;
    background:transparent;
    width:100%;font-size:13.5px;
    text-align:right;font-weight:500;
    font-family:inherit;
}
.sidebar-nav .nav-item:hover{
    background:var(--surface-2);
    color:var(--ink);
    border-color:var(--line);
    transform:translateX(-2px);
}
.sidebar-nav .nav-item.active{
    background:var(--surface-3);
    color:var(--ink);font-weight:700;
    border-color:var(--line-2);
    box-shadow:var(--shadow-xs);
}
.sidebar-nav .nav-item i{
    width:22px;font-size:14px;
    text-align:center;flex-shrink:0;
}
.sidebar-nav .nav-item span{flex:1}
.sidebar-nav .divider{
    border:none;border-top:1px solid var(--line);
    margin:10px 4px;
}
.sidebar-nav .badge{
    background:var(--accent);color:var(--accent-ink);
    font-size:10px;font-weight:800;
    border-radius:20px;padding:3px 9px;
    min-width:22px;text-align:center;
    font-variant-numeric:tabular-nums;
    line-height:1;
}
.sidebar-nav .nav-item.active .badge{
    background:var(--accent);color:var(--accent-ink);
}
.sidebar-nav .nav-item.danger i{color:var(--state-disc)}
.sidebar-nav .nav-item.danger:hover{
    background:var(--state-disc-soft);
    color:var(--state-disc);
    border-color:var(--state-disc-line);
}

/* ===== JSON ===== */
.json-overlay{
    position:fixed;inset:0;background:var(--overlay);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    z-index:1200;display:none;align-items:center;justify-content:center;
    padding:24px;
}
.json-overlay.open{display:flex;animation:fadeIn .25s ease}
.json-box{
    background:var(--surface);
    border:1px solid var(--line-2);
    border-radius:var(--radius-2xl);
    padding:26px;max-width:680px;width:100%;
    max-height:82vh;overflow-y:auto;
    box-shadow:var(--shadow-xl);
}
.json-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;padding-bottom:14px;
    border-bottom:1px solid var(--line);
}
.json-header h3{
    font-size:15px;color:var(--ink);font-weight:800;
    display:flex;align-items:center;gap:10px;
    letter-spacing:-.3px;
}
.json-header h3 i{color:var(--gold)}
.close-json{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--muted-2);
    width:34px;height:34px;border-radius:10px;
    font-size:16px;transition:all .25s ease;
    display:flex;align-items:center;justify-content:center;
}
.close-json:hover{
    color:var(--ink);background:var(--surface-3);
    border-color:var(--line-3);
}
.json-box pre{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px;line-height:1.75;
    color:var(--ink-2);
    white-space:pre-wrap;word-break:break-all;
    padding:16px;background:var(--surface-2);
    border-radius:var(--radius);
    border:1px solid var(--line);
    max-height:52vh;overflow-y:auto;
}
.json-actions{
    display:flex;gap:10px;margin-top:16px;
    justify-content:flex-end;
}
.json-actions button{
    padding:10px 20px;border-radius:999px;
    border:1px solid var(--line-2);
    font-size:12px;font-weight:700;
    background:var(--surface-2);color:var(--ink);
    transition:all .25s cubic-bezier(.4,0,.2,1);
    display:inline-flex;align-items:center;gap:7px;
}
.json-actions button:hover{
    background:var(--surface-3);
    border-color:var(--line-3);
    transform:translateY(-1px);
    box-shadow:var(--shadow-sm);
}
.json-actions .download-json{
    background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);
}
.json-actions .download-json:hover{opacity:.9;background:var(--accent)}

/* ===== TOAST ===== */
.toast{
    position:fixed;bottom:28px;left:50%;
    transform:translateX(-50%) translateY(30px) scale(.94);
    background:var(--surface);
    border:1px solid var(--line-2);
    color:var(--ink);
    padding:12px 22px;border-radius:999px;
    font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow-xl);
    opacity:0;visibility:hidden;
    transition:all .35s cubic-bezier(.4,0,.2,1);
    z-index:2000;
    display:flex;align-items:center;gap:10px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.toast.show{
    opacity:1;visibility:visible;
    transform:translateX(-50%) translateY(0) scale(1);
}
.toast i{color:var(--state-cont);font-size:14px}

@media(max-width:600px){
    body{padding:0 12px 24px}
    .header{padding:12px 0;margin-bottom:18px}
    .logo-big-wrap{min-height:140px;padding:16px 0 24px}
    .logo-motion{width:88px;height:128px}
    .card{padding:16px 16px 16px 18px}
    .card-name{font-size:15px}
    .sidebar{width:280px;padding:20px}
    .side-stats{gap:8px}
    .side-stat{padding:12px 8px 10px}
    .side-stat .v{font-size:19px}
    #command{font-size:13px;min-height:38px}
    .icon-btn{width:34px;height:34px;font-size:12px}
    .icon-btn.filter-btn{padding:0 10px;font-size:10.5px}
    .card-meta{grid-template-columns:repeat(2,1fr);gap:8px}
    .json-box{padding:20px;border-radius:22px}
    .json-box pre{font-size:10.5px}
    .quick button{font-size:10px;padding:8px 4px}
    .quick button i{font-size:9px}
}
</style>
</head>

</header>

</div>

<!-- ===== RESULTS ===== -->
<div class="results" id="results">

</div>

<!-- ===== INFO ===== -->

<!-- ===== SIDEBAR ===== -->

            <svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
                <path d="M 25 20 L 185 20 L 105 160 Z M 58 43 L 152 43 L 105 153 Z"
                      fill="currentColor" fill-rule="evenodd"/>
                <path d="M 25 300 L 185 300 L 105 160 Z M 58 277 L 152 277 L 105 167 Z"
                      fill="currentColor" fill-rule="evenodd"/>
                <rect x="195" y="20" width="12" height="65" rx="2" fill="currentColor"/>

            </svg>
            <span>ZI</span>

    <div class="side-stats">

            <div class="l">پیوسته</div>
        </div>

    <hr class="divider">

            <span>پرینت JSON</span>

                <i class="fas fa-times"></i>
            </button>
        </div>
        <pre id="jsonContent">[]</pre>
        <div class="json-actions">
            <button class="copy-json" id="copyJson">
                <i class="fas fa-copy"></i> کپی

            <button class="download-json" id="downloadJson">
                <i class="fas fa-download"></i> دانلود
            </button>

</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastText">آماده</span>
</div>

function defaultItem(raw){
    return {
        code: raw.code,
        name: raw.name,
        type: raw.type,
        material: raw.material,
        color: raw.color,
        master: "neutral",
        reason: "",
        operations:{
            washed:false, ironed:false, placed:false, dried:false,
            folded:false, polished:false, repaired:false, paired:false
        },
        archived: false,
        updatedAt: null
    };
}

function loadFromStorage(){
    let saved = {};
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
            const parsed = JSON.parse(raw);
            if(Array.isArray(parsed)){
                parsed.forEach(x=>{ if(x && x.code) saved[x.code] = x; });
            }
        }
    }catch(e){}

    return RAW_ITEMS.map(raw=>{
        const base = defaultItem(raw);
        const s = saved[raw.code];
        if(!s) return base;
        return {
            code: base.code,
            name: base.name,
            type: base.type,
            material: base.material,
            color: base.color,
            master: s.master || "neutral",
            reason: s.reason || "",
            operations: Object.assign({}, base.operations, s.operations || {}),
            archived: !!s.archived,
            updatedAt: s.updatedAt || null
        };
    });
}

}

function norm(v){
    return String(v||"")
        .toLowerCase()
        .replace(/ي/g,"ی").replace(/ى/g,"ی")
        .replace(/ك/g,"ک").replace(/ة/g,"ه")
        .replace(/\u200c/g," ")
        .replace(/[ًٌٍَُِّْ]/g,"")
        .replace(/[ـ]/g,"")
        .replace(/[،؛,.!?؟\-_/\\()\[\]{}«»"'`]/g," ")
        .replace(/\s+/g," ")
        .trim();
}
function tokens(s){ return norm(s).split(" ").filter(Boolean); }

function scorePhrase(normText, tokensArr, phrase){
    const np = norm(phrase);
    if(!np) return 0;
    if(normText.includes(np)) return np.length * 2 + 6;
    const pt = np.split(" ").filter(Boolean);
    if(!pt.length) return 0;
    const allIn = pt.every(p => tokensArr.some(t => t === p || t.startsWith(p) || p.startsWith(t)));
    if(allIn) return np.length + 3;
    return 0;
}
function bestMatch(normText, tokensArr, patterns){
    let best = { phrase:"", score:0 };
    for(const p of patterns){
        const s = scorePhrase(normText, tokensArr, p);
        if(s > best.score) best = { phrase:p, score:s };
    }
    return best;
}

function detectActions(text){
    const normText = norm(text);
    const tokensArr = tokens(normText);
    if(!tokensArr.length) return [];

    const results = [];

    for(const key of ["continuous","disconnected","neutral","archive","unarchive"]){
        const m = bestMatch(normText, tokensArr, SPECIAL_PATTERNS[key].patterns);
        if(m.score > 0){
            results.push({ type:key, score:m.score + SPECIAL_PATTERNS[key].weight });
        }
    }

    const reasons = [];
    for(const key of ["dirty","damaged","lost","torn"]){
        const m = bestMatch(normText, tokensArr, SPECIAL_PATTERNS[key].patterns);
        if(m.score > 0){
            reasons.push({ reason:key, score:m.score + SPECIAL_PATTERNS[key].weight });
        }
    }

    for(const key of Object.keys(ACTION_PATTERNS)){
        const m = bestMatch(normText, tokensArr, ACTION_PATTERNS[key].patterns);
        if(m.score > 0){
            results.push({ type:key, score:m.score + ACTION_PATTERNS[key].weight });
        }
    }

    const contHit = results.find(r=>r.type === "continuous");
    if(contHit) return [contHit];

    const neutHit = results.find(r=>r.type === "neutral");
    if(neutHit) return [neutHit];

    const archHit = results.find(r=>r.type === "archive");
    if(archHit && !results.find(r=>r.type === "unarchive")) return [archHit];

    const unarchHit = results.find(r=>r.type === "unarchive");
    if(unarchHit) return [unarchHit];

    const discHit = results.find(r=>r.type === "disconnected");
    if(discHit){
        reasons.sort((a,b)=>b.score - a.score);
        const bestReason = reasons[0] || null;
        return [{ type:"disconnected", reason: bestReason ? bestReason.reason : "نامشخص", score: discHit.score }];
    }
    if(reasons.length){
        reasons.sort((a,b)=>b.score - a.score);
        return [{ type:"disconnected", reason: reasons[0].reason, score: reasons[0].score }];
    }

    const uniq = {};
    results.forEach(r=>{
        if(!uniq[r.type] || uniq[r.type].score < r.score) uniq[r.type] = r;
    });
    return Object.values(uniq);
}

function reasonLabel(code){
    const map = {
        dirty:"کثیف",
        damaged:"آسیب‌دیده",
        lost:"مفقود",
        torn:"نیازمند تعمیر",
        "نامشخص":"نیازمند رسیدگی"
    };
    return map[code] || code;
}

/* ---------------- Master transitions ---------------- */
function setContinuous(item){
    item.master = "continuous";
    item.reason = "";
    item.archived = false;
    Object.keys(item.operations).forEach(k=>{ item.operations[k] = false; });
    item.updatedAt = new Date().toISOString();
}
function setNeutral(item){
    item.master = "neutral";
    item.reason = "";
    item.archived = false;
    item.updatedAt = new Date().toISOString();
}
function setDisconnected(item, reason){
    item.master = "disconnected";
    item.reason = reason || "صلاحیت استفاده ندارد";
    Object.keys(item.operations).forEach(k=>{ item.operations[k] = false; });
    item.updatedAt = new Date().toISOString();
}
function setArchived(item){
    item.archived = true;
    item.updatedAt = new Date().toISOString();
}
function setUnarchived(item){
    item.archived = false;
    item.master = "neutral";
    item.reason = "";
    item.updatedAt = new Date().toISOString();
}

function getRequiredOps(item){
    if(item.type === "کفش") return ["washed","polished","placed"];
    if(item.type === "حوله") return ["washed","placed"];
    return ["washed","ironed","placed"];
}
function checkCycleComplete(item){
    const required = getRequiredOps(item);
    return required.every(op => item.operations[op] === true);
}

function applyMultiple(item, actions){
    if(!actions || !actions.length) return;

    for(const a of actions){
        const t = a.type;

        if(t === "continuous"){ setContinuous(item); return; }
        if(t === "neutral"){ setNeutral(item); return; }
        if(t === "archive"){ setArchived(item); return; }
        if(t === "unarchive"){ setUnarchived(item); return; }
        if(t === "disconnected"){ setDisconnected(item, reasonLabel(a.reason)); return; }

        if(t === "washed"){
            item.reason = "";
            if(item.master === "disconnected") item.master = "neutral";
            item.operations.washed = true;
            item.updatedAt = new Date().toISOString();
            continue;
        }

        if(t === "repaired"){
            if(!opAllowed(item, t)) continue;
            item.reason = "";
            if(item.master === "disconnected") item.master = "neutral";
            item.operations.repaired = true;
            item.updatedAt = new Date().toISOString();
            continue;
        }

        if(!opAllowed(item, t)) continue;
        if(item.operations[t] !== undefined) item.operations[t] = true;
        item.updatedAt = new Date().toISOString();
    }

    if(item.master !== "disconnected" && checkCycleComplete(item)){
        setContinuous(item);
    } else if(item.master !== "disconnected" && item.master !== "continuous"){
        item.master = "neutral";
    }
}

function findItems(command){
    const text = norm(command);
    if(!text) return [];

    const byCode = items.filter(i => text.includes(norm(i.code)));
    if(byCode.length) return byCode;

    const byName = items.filter(i => text.includes(norm(i.name)));
    if(byName.length) return byName;

    const byTypeColor = items.filter(i=>{
        const hasType = text.includes(norm(i.type));
        const hasColor = i.color && text.includes(norm(i.color));
        return hasType && hasColor;
    });
    if(byTypeColor.length) return byTypeColor;

    const byType = items.filter(i => text.includes(norm(i.type)));
    if(byType.length) return byType;

    return [];
}

function executeCommand(cmd){
    cmd = String(cmd||"").trim();
    if(!cmd) return;

    const found = findItems(cmd);
    const actions = detectActions(cmd);

    if(!found.length){
        lastResults = { found: [], error: true };
        renderResults();
        showResultsView();
        return;
    }

    if(!actions.length){
        lastResults = { found, info: true };
        renderResults();
        showResultsView();
        toastMsg('مورد پیدا شد — دستوری تشخیص داده نشد');
        return;
    }

    applyMultiple(found[0], actions);
    saveToStorage();
    lastResults = { found: [found[0]], applied: true };
    renderResults();
    showResultsView();
    updateInfo();

    const st = found[0].master;
    const msg = st === "continuous" ? "✓ " + found[0].name + " آماده‌ی استفاده"
              : st === "disconnected" ? "◌ " + found[0].name + " گسسته"
              : "○ " + found[0].name + " خنثی";
    toastMsg(msg);
}

function showResultsView(){

function escapeHtml(s){
    return String(s||"")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function formatTime(iso){
    if(!iso) return "";
    try{
        const d = new Date(iso);
        return d.toLocaleString("fa-IR");
    }catch(e){ return iso; }
}

function renderFilterGrid(){
    const grid = document.getElementById("filterGrid");
    grid.innerHTML = FILTERS.map(f=>{
        let count = 0;
        if(f.id === 'all') count = items.filter(i=>!i.archived).length;
        else if(f.id === 'continuous') count = items.filter(i=>!i.archived && i.master === 'continuous').length;
        else if(f.id === 'neutral') count = items.filter(i=>!i.archived && i.master === 'neutral').length;
        else if(f.id === 'disconnected') count = items.filter(i=>!i.archived && i.master === 'disconnected').length;
        else if(f.id === 'clothes') count = items.filter(i=>!i.archived && i.type !== 'کفش' && i.type !== 'حوله').length;
        else if(f.id === 'shoes') count = items.filter(i=>!i.archived && i.type === 'کفش').length;
        else if(f.id === 'towels') count = items.filter(i=>!i.archived && i.type === 'حوله').length;
        else if(f.id === 'archive') count = items.filter(i=>i.archived).length;

        const dotc = f.color ? `<span class="dotc"></span>` : '';
        return `
            <button class="filter-chip${currentFilter === f.id ? ' active' : ''}" data-f="${f.id}">
                ${dotc}
                <i class="fas ${f.icon}"></i>
                ${f.label}
                <span class="count">(${count})</span>
            </button>
        `;
    }).join("");

    grid.querySelectorAll('.filter-chip').forEach(chip=>{
        chip.onclick = ()=>{
            currentFilter = chip.dataset.f;
            const badge = document.getElementById("filterBadge");
            if(currentFilter === 'all') badge.style.display = 'none';
            else { badge.style.display = 'flex'; badge.textContent = '1'; }
            renderFilterGrid();
            renderResults();
            showResultsView();
            document.getElementById("filterDropdown").classList.remove("open");
            document.querySelectorAll('.sidebar-nav .nav-item').forEach(i=>{
                if(i.dataset.page) i.classList.toggle('active', i.dataset.page === currentFilter);
            });
        };
    });
}

function renderResults(){
    let list = items.slice();

    if(currentFilter === "archive"){
        list = list.filter(i=>i.archived);
    } else {
        list = list.filter(i=>!i.archived);
        if(currentFilter === "continuous") list = list.filter(i=>i.master === "continuous");
        if(currentFilter === "neutral") list = list.filter(i=>i.master === "neutral");
        if(currentFilter === "disconnected") list = list.filter(i=>i.master === "disconnected");
        if(currentFilter === "clothes") list = list.filter(i=>i.type !== "کفش" && i.type !== "حوله");
        if(currentFilter === "shoes") list = list.filter(i=>i.type === "کفش");
        if(currentFilter === "towels") list = list.filter(i=>i.type === "حوله");
    }

    const q = norm(lastQuery || "");
    if(q){
        list = list.filter(i=>{
            const hay = norm([i.name, i.code, i.type, i.material, i.color, i.reason].join(" "));
            return hay.includes(q);
        });
    }

    if(lastResults && lastResults.found && lastResults.found.length){
        const codes = new Set(lastResults.found.map(x=>x.code));
        const top = lastResults.found.filter(x=>{
            if(currentFilter === "archive") return x.archived;
            return !x.archived;
        });
        const rest = list.filter(x=>!codes.has(x.code));
        list = top.concat(rest);
    }

    document.getElementById("resultCount").textContent = `${list.length} مورد`;

    if(!list.length){
        document.getElementById("cardsContainer").innerHTML = `
            <div class="empty">
                <i class="fas fa-box-open"></i>
                <div class="title">چیزی پیدا نشد</div>
                <div class="desc">با دستور یا فیلتر دیگری امتحان کن</div>
            </div>
        `;
        return;
    }

    document.getElementById("cardsContainer").innerHTML = list.map(renderCard).join("");
}

function renderCard(item){
    const stateClass = item.archived ? "archived" : item.master;
    const required = getRequiredOps(item);
    const doneRequired = required.filter(op => item.operations[op]).length;
    let pct;
    if(item.archived) pct = 100;
    else if(item.master === "continuous") pct = 100;
    else if(item.master === "disconnected") pct = 0;
    else pct = Math.round((doneRequired / required.length) * 100);

    const opsHtml = OPS.map(o=>{
        const allowed = opAllowed(item, o.key);
        const on = item.operations[o.key];
        const cls = !allowed ? "na" : (on ? "on" : "");
        const ic = !allowed ? "fa-ban" : (on ? "fa-check" : o.icon);
        return `<span class="op ${cls}">
                    <i class="fas ${ic}"></i>
                    ${o.label}
                </span>`;
    }).join("");

    let stateLabel, stateHint, stateIcon;
    if(item.archived){
        stateLabel = "بایگانی"; stateHint = "خارج از چرخه"; stateIcon = "fa-box-archive";
    } else if(item.master === "continuous"){
        stateLabel = "پیوسته"; stateHint = "آماده‌ی استفاده"; stateIcon = "fa-circle-check";
    } else if(item.master === "disconnected"){
        stateLabel = "گسسته"; stateHint = item.reason || "صلاحیت استفاده ندارد"; stateIcon = "fa-circle-exclamation";
    } else {
        stateLabel = "خنثی"; stateHint = "در چرخه، کامل نیست"; stateIcon = "fa-circle-half-stroke";
    }

    let quick = "";
    if(item.archived){
        quick = `<div class="quick">
            <button class="gold" onclick="quickUnarchive('${item.code}')">
                <i class="fas fa-rotate-left"></i> بازگرداندن از بایگانی
            </button>
        </div>`;
    } else {
        quick = `<div class="quick">
            <button class="cont" onclick="quickContinuous('${item.code}')">
                <i class="fas fa-circle-check"></i> پیوسته
            </button>
            <button onclick="quickNeutral('${item.code}')">
                <i class="fas fa-circle-half-stroke"></i> خنثی
            </button>
            <button class="disc" onclick="quickDisconnect('${item.code}')">
                <i class="fas fa-circle-exclamation"></i> گسسته
            </button>
            <button class="gold" onclick="quickArchive('${item.code}')">
                <i class="fas fa-box-archive"></i> بایگانی
            </button>
        </div>`;
    }

    const timeStr = formatTime(item.updatedAt);

    return `
        <article class="card ${stateClass}">
            <div class="card-head">
                <div style="flex:1;min-width:0">
                    <div class="card-name">${escapeHtml(item.name)}</div>
                    <div class="card-code">${escapeHtml(item.code)}</div>
                </div>
                <span class="card-type">${escapeHtml(item.type)}</span>
            </div>

            <div class="card-meta">
                <div class="m-item">
                    <span class="m-lbl">جنس</span>
                    <span class="m-val">${escapeHtml(item.material || "—")}</span>
                </div>
                <div class="m-item">
                    <span class="m-lbl">رنگ</span>
                    <span class="m-val">${escapeHtml(item.color || "—")}</span>
                </div>
            </div>

            <div class="card-status ${stateClass}">
                <span class="dot"></span>
                <i class="fas ${stateIcon}"></i>
                <span>${stateLabel}</span>
                <span class="hint">${escapeHtml(stateHint)}</span>
            </div>

            <div class="cycle"><div class="cycle-fill" style="width:${pct}%"></div></div>
            <div class="cycle-label">
                <span>چرخه</span>
                <span>${doneRequired} از ${required.length} عملیات لازم</span>
            </div>

            <div class="ops">${opsHtml}</div>
            ${quick}
            ${timeStr ? `<div class="card-time">آخرین تغییر: ${escapeHtml(timeStr)}</div>` : ""}
        </article>
    `;
}

function findItem(code){ return items.find(x=>x.code === code); }

function quickContinuous(code){
    const item = findItem(code); if(!item) return;
    setContinuous(item); saveToStorage();
    renderResults(); updateInfo();
    toastMsg("✓ " + item.name + " آماده‌ی استفاده");
}
function quickNeutral(code){
    const item = findItem(code); if(!item) return;
    setNeutral(item); saveToStorage();
    renderResults(); updateInfo();
    toastMsg("○ " + item.name + " خنثی");
}
function quickDisconnect(code){
    const item = findItem(code); if(!item) return;
    setDisconnected(item, "صلاحیت استفاده ندارد"); saveToStorage();
    renderResults(); updateInfo();
    toastMsg("◌ " + item.name + " گسسته");
}
function quickArchive(code){
    const item = findItem(code); if(!item) return;
    setArchived(item); saveToStorage();
    renderResults(); updateInfo();
    toastMsg("⌁ " + item.name + " بایگانی شد");
}
function quickUnarchive(code){
    const item = findItem(code); if(!item) return;
    setUnarchived(item); saveToStorage();
    renderResults(); updateInfo();
    toastMsg("↺ " + item.name + " از بایگانی خارج شد");
}
window.quickContinuous = quickContinuous;
window.quickNeutral = quickNeutral;
window.quickDisconnect = quickDisconnect;
window.quickArchive = quickArchive;
window.quickUnarchive = quickUnarchive;

const filterBtn = document.getElementById("filterBtn");
const filterDropdown = document.getElementById("filterDropdown");
filterBtn.onclick = e=>{
    e.stopPropagation();
    filterDropdown.classList.toggle("open");
};
document.addEventListener("click", ()=> filterDropdown.classList.remove("open"));

const commandInput = document.getElementById("command");
document.getElementById("clearBtn").onclick = ()=>{
    commandInput.value = "";
    lastQuery = "";
    lastResults = null;
    document.getElementById("results").classList.remove("visible");
    document.getElementById("backWrap").classList.remove("visible");
};
commandInput.addEventListener("input", ()=>{
    lastQuery = commandInput.value;
    if(lastQuery.trim()){
        renderResults();
        showResultsView();
    } else {
        document.getElementById("results").classList.remove("visible");
        document.getElementById("backWrap").classList.remove("visible");
    }
});
commandInput.addEventListener("keydown", e=>{
    if(e.key === "Enter") executeCommand(commandInput.value);
});

const voiceBtn = document.getElementById("voiceBtn");
const voiceLive = document.getElementById("voiceLive");
const voiceText = document.getElementById("voiceText");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if(Recognition){
    recognition = new Recognition();
    recognition.lang = "fa-IR";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;

    voiceBtn.onclick = ()=>{
        if(listening){ try{ recognition.stop(); }catch(e){} return; }
        try{ recognition.start(); }catch(e){}
    };
    recognition.onstart = ()=>{
        listening = true;
        voiceBtn.classList.add("listening");
        voiceBtn.innerHTML = '<i class="fas fa-stop"></i>';
        voiceLive.classList.add("show");
        voiceText.textContent = "در حال گوش دادن...";
        voiceText.classList.add("empty");
    };
    recognition.onresult = (event)=>{
        let transcript = "";
        let isFinal = false;
        for(let i=event.resultIndex; i<event.results.length; i++){
            transcript += event.results[i][0].transcript;
            if(event.results[i].isFinal) isFinal = true;
        }
        voiceText.textContent = transcript || "در حال گوش دادن...";
        voiceText.classList.toggle("empty", !transcript);
        if(isFinal){
            commandInput.value = transcript;
            lastQuery = transcript;
            setTimeout(()=> executeCommand(transcript), 200);
        }
    };
    recognition.onend = ()=>{
        listening = false;
        voiceBtn.classList.remove("listening");
        voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        setTimeout(()=>{
            voiceLive.classList.remove("show");
            voiceText.textContent = "در حال گوش دادن...";
            voiceText.classList.add("empty");
        }, 900);
    };
    recognition.onerror = ()=>{
        listening = false;
        voiceBtn.classList.remove("listening");
        voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        voiceText.textContent = "خطا در دریافت صدا";
        setTimeout(()=> voiceLive.classList.remove("show"), 1200);
    };
}else{
    voiceBtn.onclick = ()=> toastMsg('مرورگر از تشخیص صوتی پشتیبانی نمی‌کند');
}

const sidebar = document.getElementById("sidebar");
const sidebarOverlay = document.getElementById("sidebarOverlay");
const menuBtn = document.getElementById("menuBtn");
const closeSidebar = document.getElementById("closeSidebar");

function openSidebar(){
    sidebar.classList.add("open");
    sidebarOverlay.classList.add("active");
    document.querySelectorAll('.sidebar-nav .nav-item').forEach(i=>{
        if(i.dataset.page) i.classList.toggle('active', i.dataset.page === currentFilter);
    });
}
function closeSidebarPanel(){
    sidebar.classList.remove("open");
    sidebarOverlay.classList.remove("active");
}
menuBtn.onclick = openSidebar;
closeSidebar.onclick = closeSidebarPanel;
sidebarOverlay.onclick = closeSidebarPanel;
document.addEventListener("keydown", e=>{
    if(e.key === "Escape"){ closeSidebarPanel(); closeJson(); }
});

document.querySelectorAll('.sidebar-nav .nav-item').forEach(item=>{
    item.onclick = ()=>{
        const page = item.dataset.page;

        if(page === 'home'){
            currentFilter = 'all'; lastQuery = ''; lastResults = null;
            commandInput.value = '';
            document.getElementById("results").classList.remove("visible");
            document.getElementById("backWrap").classList.remove("visible");
            document.getElementById("filterBadge").style.display = 'none';
            renderFilterGrid(); closeSidebarPanel(); return;
        }
        if(page === 'explore'){
            currentFilter = 'all'; lastQuery = ''; lastResults = null;
            commandInput.value = '';
            renderFilterGrid(); renderResults(); showResultsView();
            document.getElementById("filterBadge").style.display = 'none';
            closeSidebarPanel(); return;
        }
        if(['continuous','neutral','disconnected','archive'].includes(page)){
            currentFilter = page;
            const badge = document.getElementById("filterBadge");
            badge.style.display = 'flex'; badge.textContent = '1';
            renderFilterGrid(); renderResults(); showResultsView();
            closeSidebarPanel(); return;
        }
        if(page === 'print'){ openJson(); closeSidebarPanel(); return; }
        if(page === 'export-backup'){ exportBackup(); closeSidebarPanel(); return; }
        if(page === 'import-backup'){ importBackup(); closeSidebarPanel(); return; }
        if(page === 'reset-storage'){ resetStorage(); closeSidebarPanel(); return; }
        closeSidebarPanel();
    };
});

document.getElementById("backBtn").onclick = ()=>{
    currentFilter = 'all'; lastQuery = ''; lastResults = null;
    commandInput.value = '';
    document.getElementById("results").classList.remove("visible");
    document.getElementById("backWrap").classList.remove("visible");
    document.getElementById("filterBadge").style.display = 'none';
    renderFilterGrid(); updateInfo();
    document.querySelectorAll('.sidebar-nav .nav-item').forEach(i=>i.classList.remove('active'));
    document.querySelector('.sidebar-nav .nav-item[data-page="home"]').classList.add('active');
};

function exportBackup(){
    const data = {
        version: 2,
        exportedAt: new Date().toISOString(),
        theme: document.documentElement.getAttribute("data-theme"),
        items: items
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zi_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toastMsg('پشتیبان دانلود شد');
}

function importBackup(){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = e=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev=>{
            try{
                const parsed = JSON.parse(ev.target.result);
                let newItems = null;
                if(Array.isArray(parsed)) newItems = parsed;
                else if(parsed && Array.isArray(parsed.items)) newItems = parsed.items;
                if(!newItems){ toastMsg('فایل معتبر نیست'); return; }

                const dict = {};
                newItems.forEach(x=>{ if(x && x.code) dict[x.code] = x; });

                items = RAW_ITEMS.map(raw=>{
                    const base = defaultItem(raw);
                    const s = dict[raw.code];
                    if(!s) return base;
                    return {
                        code: base.code, name: base.name,
                        type: base.type, material: base.material, color: base.color,
                        master: s.master || "neutral", reason: s.reason || "",
                        operations: Object.assign({}, base.operations, s.operations || {}),
                        archived: !!s.archived, updatedAt: s.updatedAt || null
                    };
                });

                saveToStorage();
                renderResults(); updateInfo(); renderFilterGrid();
                toastMsg('پشتیبان بازیابی شد');
            }catch(err){ toastMsg('خطا در خواندن فایل'); }
        };
        reader.readAsText(file);
    };
    input.click();
}

function resetStorage(){
    if(!confirm('همه‌ی وضعیت‌های ذخیره‌شده پاک شوند؟')) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    items = RAW_ITEMS.map(defaultItem);
    currentFilter = 'all';
    renderResults(); updateInfo(); renderFilterGrid();
    document.getElementById("results").classList.remove("visible");
    document.getElementById("backWrap").classList.remove("visible");
    toastMsg('حافظه پاک شد');
}

const jsonOverlay = document.getElementById("jsonOverlay");
const jsonContent = document.getElementById("jsonContent");

function openJson(){
    const data = items.map(x=>({
        code:x.code, name:x.name, type:x.type,
        material:x.material, color:x.color,
        master:x.master, reason:x.reason,
        operations:x.operations, archived:!!x.archived,
        updatedAt:x.updatedAt
    }));
    jsonContent.textContent = JSON.stringify(data, null, 2);
    jsonOverlay.classList.add("open");
}
function closeJson(){ jsonOverlay.classList.remove("open"); }
document.getElementById("closeJson").onclick = closeJson;
jsonOverlay.onclick = e=>{ if(e.target === jsonOverlay) closeJson(); };
document.getElementById("copyJson").onclick = ()=>{
    navigator.clipboard.writeText(jsonContent.textContent)
        .then(()=> toastMsg('JSON کپی شد'))
        .catch(()=> toastMsg('خطا در کپی'));
};
document.getElementById("downloadJson").onclick = ()=>{
    const blob = new Blob([jsonContent.textContent], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zi_export_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toastMsg('دانلود شد');
};

let toastTimer = null;
function toastMsg(msg){
    const t = document.getElementById("toast");
    document.getElementById("toastText").textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove("show"), 2400);
}

function updateInfo(){
    const cont = items.filter(i=>!i.archived && i.master === 'continuous').length;
    const neut = items.filter(i=>!i.archived && i.master === 'neutral').length;
    const disc = items.filter(i=>!i.archived && i.master === 'disconnected').length;
    const arch = items.filter(i=>i.archived).length;

    document.getElementById("sCont").textContent = cont;
    document.getElementById("sNeut").textContent = neut;
    document.getElementById("sDisc").textContent = disc;
    document.getElementById("sArch").textContent = arch;

    document.getElementById("badgeAll").textContent = cont + neut + disc;
    document.getElementById("badgeCont").textContent = cont;
    document.getElementById("badgeNeut").textContent = neut;
    document.getElementById("badgeDisc").textContent = disc;
    document.getElementById("badgeArch").textContent = arch;

    document.getElementById("info").textContent =
        `${cont} پیوسته • ${neut} خنثی • ${disc} گسسته • ${arch} بایگانی`;
}

renderFilterGrid();
updateInfo();
</script>
